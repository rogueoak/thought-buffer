name: ThoughtStream

options:
  bundleIdPrefix: com.rogueoak
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ThoughtStream:
    type: application
    platform: iOS
    sources:
      - path: ThoughtStream
    # iCloud Documents capability. The entitlement names the ubiquity container; on a device with
    # a development team set, the capability auto-provisions it. For the Simulator, code signing is
    # disabled below, so the embedded entitlement is not validated and the unsigned build stays
    # green with no team.
    entitlements:
      path: ThoughtStream/ThoughtStream.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.rogueoak.thoughtstream
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.rogueoak.thoughtstream
    # An explicit Info.plist (not the generated one) because NSUbiquitousContainers is a nested
    # dictionary that the flat INFOPLIST_KEY_* build settings cannot express. XcodeGen writes this
    # plist from the properties below and sets GENERATE_INFOPLIST_FILE=NO for this target.
    info:
      path: ThoughtStream/Info.plist
      properties:
        CFBundleDisplayName: Thought Stream
        UILaunchScreen: {}
        # Multiple scenes are enabled so the CarPlay scene can coexist with the phone window. The
        # phone UI is SwiftUI (a `WindowGroup`, no explicit delegate needed); the CarPlay scene names
        # its `CPTemplateApplicationSceneDelegate`. The CarPlay role stays dormant without the CarPlay
        # entitlement (not declared on this target - see spec 0005), so the unsigned Simulator build
        # and the App Store build are unaffected and the phone scene is the only one that activates.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: ThoughtStreamCarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Thought Stream uses the microphone to hear you and turn your words into notes. Audio stays on your device."
        NSSpeechRecognitionUsageDescription: "Thought Stream turns your speech into notes on device. Nothing you say leaves your phone."
        # Make the container's Documents folder user-visible in the Files app as "Thought Stream".
        NSUbiquitousContainers:
          iCloud.com.rogueoak.thoughtstream:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Thought Stream
            NSUbiquitousContainerSupportedFolderLevels: One
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rogueoak.thoughtstream
        PRODUCT_NAME: ThoughtStream
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

  ThoughtStreamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ThoughtStreamTests
    dependencies:
      - target: ThoughtStream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rogueoak.thoughtstream.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  ThoughtStream:
    build:
      targets:
        ThoughtStream: all
        ThoughtStreamTests: [test]
    test:
      targets:
        - ThoughtStreamTests
    run:
      config: Debug
