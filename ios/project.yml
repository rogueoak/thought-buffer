name: ThoughtStream

options:
  bundleIdPrefix: com.rogueoak
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ThoughtStream:
    type: application
    platform: iOS
    sources:
      - path: ThoughtStream
    # iCloud Documents capability is currently DISABLED so the app provisions on a free/personal
    # Apple Developer team (personal teams cannot use the iCloud capability). The storage layer
    # falls back to local storage automatically when no iCloud container resolves, so the app is
    # fully functional without it - notes are stored on device. To re-enable iCloud sync on a PAID
    # Apple Developer account, restore the `entitlements:` block and the `NSUbiquitousContainers`
    # Info.plist entry below - the exact blocks are in docs/icloud-capability.md.
    # An explicit Info.plist (not the generated one) because NSUbiquitousContainers is a nested
    # dictionary that the flat INFOPLIST_KEY_* build settings cannot express. XcodeGen writes this
    # plist from the properties below and sets GENERATE_INFOPLIST_FILE=NO for this target.
    info:
      path: ThoughtStream/Info.plist
      properties:
        CFBundleDisplayName: Thought Stream
        UILaunchScreen: {}
        # Background audio (spec 0008): a note played on the phone keeps playing when the screen locks
        # or the app backgrounds, and shows on the lock screen / Control Center via the shared playback
        # controller's `MPNowPlayingInfoCenter` wiring. This is a real Audio-app trait and needs NO
        # entitlement, so the unsigned Simulator build and the App Store build stay green. It also
        # substantiates the CarPlay Audio-category identity (see the entitlement-request doc).
        UIBackgroundModes:
          - audio
        # Multiple scenes are enabled so the CarPlay scene can coexist with the phone window. The
        # phone UI is SwiftUI (a `WindowGroup`, no explicit delegate needed); the CarPlay scene names
        # its `CPTemplateApplicationSceneDelegate`. The CarPlay role stays dormant without the CarPlay
        # entitlement (not declared on this target - see spec 0005), so the unsigned Simulator build
        # and the App Store build are unaffected and the phone scene is the only one that activates.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: ThoughtStreamCarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Thought Stream uses the microphone to hear you and turn your words into notes. Audio stays on your device."
        NSSpeechRecognitionUsageDescription: "Thought Stream turns your speech into notes on device. Nothing you say leaves your phone."
        # NSUbiquitousContainers (Files-app visibility for the iCloud folder) is omitted while the
        # iCloud capability is disabled for personal-team builds. Restore it when re-enabling iCloud
        # on a paid account - see docs/icloud-capability.md.
    # Device builds sign with your team from ios/Signing.local.xcconfig (git-ignored; see
    # ios/Signing.xcconfig for how to set it). Signing is disabled for the SIMULATOR SDK only,
    # so unsigned Simulator builds and tests stay green with no Apple Developer team.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rogueoak.thoughtstream
        PRODUCT_NAME: ThoughtStream
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"

  ThoughtStreamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ThoughtStreamTests
    dependencies:
      - target: ThoughtStream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rogueoak.thoughtstream.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  ThoughtStream:
    build:
      targets:
        ThoughtStream: all
        ThoughtStreamTests: [test]
    test:
      targets:
        - ThoughtStreamTests
    run:
      config: Debug
