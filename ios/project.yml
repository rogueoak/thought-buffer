name: ThoughtStream

options:
  bundleIdPrefix: com.rogueoak
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ThoughtStream:
    type: application
    platform: iOS
    sources:
      - path: ThoughtStream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rogueoak.thoughtstream
        PRODUCT_NAME: ThoughtStream
        INFOPLIST_KEY_CFBundleDisplayName: Thought Stream
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Thought Stream uses the microphone to hear you and turn your words into notes. Audio stays on your device."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Thought Stream turns your speech into notes on device. Nothing you say leaves your phone."
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

  ThoughtStreamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ThoughtStreamTests
    dependencies:
      - target: ThoughtStream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rogueoak.thoughtstream.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  ThoughtStream:
    build:
      targets:
        ThoughtStream: all
        ThoughtStreamTests: [test]
    test:
      targets:
        - ThoughtStreamTests
    run:
      config: Debug
