name: ThoughtBuffer

options:
  bundleIdPrefix: com.rogueoak
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  # Stamp the project's LastUpgradeCheck to Xcode 26 so the IDE stops flagging "Update to recommended
  # settings" against a stale marker. The recommended build settings themselves (modern CLANG_WARN_*
  # set and ENABLE_USER_SCRIPT_SANDBOXING) are already emitted; only the version marker was stale. This
  # touches no signing or deployment-target setting.
  xcodeVersion: "2600"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # iPhone (1) AND iPad (2): Thought Buffer is a first-class iPad app (spec 0022), presenting an
    # adaptive `NavigationSplitView` on regular width and the iPhone `NavigationStack` on compact.
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ThoughtBuffer:
    type: application
    platform: iOS
    sources:
      - path: ThoughtBuffer
      # Shared, PLATFORM-NEUTRAL source (spec 0023): the WatchConnectivity wire payloads/codecs and the
      # recent-thoughts projector, compiled into BOTH the iOS app and the watchOS app so the two sides
      # serialize identically and cannot drift.
      - path: ThoughtBufferShared
    # iCloud Documents capability is currently DISABLED so the app provisions on a free/personal
    # Apple Developer team (personal teams cannot use the iCloud capability). The storage layer
    # falls back to local storage automatically when no iCloud container resolves, so the app is
    # fully functional without it - thoughts are stored on device. To re-enable iCloud sync on a PAID
    # Apple Developer account, restore the `entitlements:` block and the `NSUbiquitousContainers`
    # Info.plist entry below - the exact blocks are in docs/icloud-capability.md.
    # An explicit Info.plist (not the generated one) because NSUbiquitousContainers is a nested
    # dictionary that the flat INFOPLIST_KEY_* build settings cannot express. XcodeGen writes this
    # plist from the properties below and sets GENERATE_INFOPLIST_FILE=NO for this target.
    info:
      path: ThoughtBuffer/Info.plist
      properties:
        CFBundleDisplayName: Thought Buffer
        UILaunchScreen: {}
        # Background audio (spec 0008): a thought played on the phone keeps playing when the screen locks
        # or the app backgrounds, and shows on the lock screen / Control Center via the shared playback
        # controller's `MPNowPlayingInfoCenter` wiring. This is a real Audio-app trait and needs NO
        # entitlement, so the unsigned Simulator build and the App Store build stay green. It also
        # substantiates the CarPlay Audio-category identity (see the entitlement-request doc).
        UIBackgroundModes:
          - audio
        # Multiple scenes are enabled so the CarPlay scene can coexist with the phone window. The
        # phone UI is SwiftUI (a `WindowGroup`, no explicit delegate needed); the CarPlay scene names
        # its `CPTemplateApplicationSceneDelegate`. The CarPlay role stays dormant without the CarPlay
        # entitlement (not declared on this target - see spec 0005), so the unsigned Simulator build
        # and the App Store build are unaffected and the phone scene is the only one that activates.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: ThoughtBufferCarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        # iPhone stays portrait-only (the compact stack is designed for it). iPad supports ALL
        # orientations (spec 0022) so the split view uses landscape and rotation adapts without a
        # broken layout - the device-family-suffixed key applies only to iPad.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Thought Buffer uses the microphone to hear you and turn your words into thoughts. Audio stays on your device."
        NSSpeechRecognitionUsageDescription: "Thought Buffer turns your speech into thoughts on device. Nothing you say leaves your phone."
        # NSUbiquitousContainers (Files-app visibility for the iCloud folder) is omitted while the
        # iCloud capability is disabled for personal-team builds. Restore it when re-enabling iCloud
        # on a paid account - see docs/icloud-capability.md.
    # Device builds sign with your team from ios/Signing.local.xcconfig (git-ignored; see
    # ios/Signing.xcconfig for how to set it). Signing is disabled for the SIMULATOR SDK only,
    # so unsigned Simulator builds and tests stay green with no Apple Developer team.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rogueoak.thoughtbuffer
        PRODUCT_NAME: ThoughtBuffer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
    # Embed the paired watch app so it installs alongside the phone app (spec 0023). The watch app is a
    # companion of com.rogueoak.thoughtbuffer; XcodeGen wires the embed build phase from this dependency.
    dependencies:
      - target: ThoughtBufferWatch
        embed: true

  # The watchOS app (spec 0023): quick-capture + browse. Paired with the iOS app as a companion, its
  # bundle id prefixed by the phone app's id (com.rogueoak.thoughtbuffer.watchkitapp). It records audio
  # on the wrist and syncs it to the phone (which transcribes and files it), and browses the recent
  # thoughts the phone pushes. It compiles the shared payload/projection source plus the specific
  # platform-neutral model/token files it needs (Thought, timing, grouper, Canopy tokens).
  ThoughtBufferWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: "ThoughtBufferWatch Watch App"
      - path: ThoughtBufferShared
      # Specific platform-neutral files reused from the iOS app (no UIKit-only / iOS-only dependency),
      # so the watch shares ONE definition of the thought model, its timing math, paragraph grouping,
      # and the Canopy tokens rather than forking them.
      - path: ThoughtBuffer/Models/Thought.swift
      - path: ThoughtBuffer/Speech/RecordingTiming.swift
      - path: ThoughtBuffer/Speech/ParagraphGrouper.swift
      - path: ThoughtBuffer/Speech/SentenceTokenizer.swift
      - path: ThoughtBuffer/DesignSystem/Tokens.swift
    info:
      path: "ThoughtBufferWatch Watch App/Info.plist"
      properties:
        CFBundleDisplayName: Thought Buffer
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.rogueoak.thoughtbuffer
        NSMicrophoneUsageDescription: "Thought Buffer uses the microphone to record a voice thought, which syncs to your iPhone."
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rogueoak.thoughtbuffer.watchkitapp
        PRODUCT_NAME: ThoughtBufferWatch
        INFOPLIST_KEY_WKApplication: "YES"
        "CODE_SIGNING_ALLOWED[sdk=watchsimulator*]": "NO"
        "CODE_SIGNING_REQUIRED[sdk=watchsimulator*]": "NO"

  ThoughtBufferTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ThoughtBufferTests
    dependencies:
      - target: ThoughtBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rogueoak.thoughtbuffer.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  ThoughtBuffer:
    build:
      targets:
        ThoughtBuffer: all
        ThoughtBufferTests: [test]
    test:
      targets:
        - ThoughtBufferTests
    run:
      config: Debug
  # The watch app scheme (spec 0023), so the watchOS target builds and runs on a paired watch simulator.
  ThoughtBufferWatch:
    build:
      targets:
        ThoughtBufferWatch: all
    run:
      config: Debug
